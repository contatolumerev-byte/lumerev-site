name: Final Lume copy cleanup

on:
  push:
    branches: [reposicionamento-agencia-moda]

permissions:
  contents: write

jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, '[skip copy]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final approved wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('A Lume Rev conecta estratégia, posicionamento, marketing, vendas, experiência, processos e dados para transformar operações fragmentadas em negócios mais claros, coerentes e preparados para crescer.','A Lume Rev é uma agência boutique de estratégia e marketing que conecta posicionamento, branding, design, comunicação e conversão para marcas que querem crescer com clareza.')
          s=s.replace('duas trajetórias construídas em lados diferentes\n          da operação, mas que frequentemente chegavam\n          à mesma conclusão: os problemas de um negócio\n          raramente existem de forma isolada.','duas trajetórias construídas em universos diferentes, mas que chegaram à mesma conclusão: marca, marketing e experiência não deveriam ser pensados em partes.')
          s=s.replace('Aos poucos, algumas dessas histórias também vão\n          aparecer por aqui com mais contexto, processo e resultado.','Algumas dessas histórias vão aparecer por aqui com mais contexto, processo e resultado.')
          s=s.replace('<span>\n              processos\n            </span>\n\n            <span>\n              inteligência\n            </span>\n\n            <span>\n              automação\n            </span>','<span>\n              posicionamento\n            </span>\n\n            <span>\n              branding\n            </span>\n\n            <span>\n              estratégia\n            </span>',1)
          s=s.replace('<span>\n              posicionamento\n            </span>\n\n            <span>\n              conteúdo\n            </span>\n\n            <span>\n              campanhas\n            </span>','<span>\n              conteúdo\n            </span>\n\n            <span>\n              captação\n            </span>\n\n            <span>\n              conversão\n            </span>',1)
          s=s.replace('<span>\n              indicadores\n            </span>\n\n            <span>\n              dados\n            </span>\n\n            <span>\n              decisão\n            </span>','<span>\n              conversão\n            </span>\n\n            <span>\n              marketing\n            </span>\n\n            <span>\n              performance\n            </span>',1)
          s=s.replace('Do caos à clareza. Da estratégia à operação.','Da clareza ao posicionamento. Do posicionamento à conversão.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove helper
        run: |
          rm -f .github/workflows/final-copy-cleanup.yml
          git config user.name "Lume Rev"
          git config user.email "contatolumerev@gmail.com"
          git add index.html .github/workflows/final-copy-cleanup.yml
          git commit -m "finalize approved marketing copy [skip copy]" || exit 0
          git push
